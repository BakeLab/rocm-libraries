#
# Lightweight CI for hipDNN + providers using the rocm-libraries superbuild
# and pre-built ROCm wheels (no TheRock source build required).

name: hipDNN Superbuild CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/hipdnn-superbuild-ci.yml'
      - 'projects/hipdnn/**'
      - 'dnn-providers/**'
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  hipdnn-linux-superbuild:
    name: HipDNN Linux Superbuild
    runs-on: azure-linux-scale-rocm
    env:
      GPU_TARGET: gfx94X-dcgpu
      # Multi-arch nightly device extra (rocm[...,device-<DEVICE_TARGET>]).
      DEVICE_TARGET: gfx942
    steps:
      - name: Runner health status
        run: |
          echo "=== OS ==="
          cat /etc/os-release | head -2
          echo "=== CPU ==="
          lscpu | grep -E 'Model name|^CPU\(s\)'
          echo "=== Memory ==="
          free -h | grep Mem
          echo "=== Disk ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .dvc
            .github
            cmake
            dnn-providers
            projects/hipdnn
            projects/miopen
            test

      # Shared CI constants, kpack-ref among them, defined in one place.
      - name: Load CI environment
        id: ci-env
        uses: ./.github/actions/ci-env

      - name: Set environment
        run: |
          echo "VENV_PATH=${{ runner.temp }}/rocm_wheels" >> "$GITHUB_ENV"
          echo "THIRD_PARTY_DEPS_DIR=${{ runner.temp }}/third-party-deps" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-tidy-20 clang-tools-20

      - name: Install ROCm wheels
        run: |
          echo "Creating Python virtual environment at $VENV_PATH"
          python -m venv "$VENV_PATH"
          source "$VENV_PATH/bin/activate"

          echo "Installing ROCm wheels from multi-arch nightlies (device: $DEVICE_TARGET)"
          pip install --index-url "https://nightly.repo.amd.com/rocm/whl-next/" "rocm[libraries,devel,device-$DEVICE_TARGET]"

          # rocm_kpack is used from a source tree, so pip never resolves the
          # msgpack/zstandard it declares. The descriptor-packaging tool imports
          # it, so this lane needs them present in the configuring interpreter.
          pip install "msgpack>=1.0.0" "zstandard>=0.20.0"

          echo "Initializing ROCm SDK"
          rocm-sdk init

          SITE_PACKAGES=$("$VENV_PATH/bin/python" -c "import site; print(site.getsitepackages()[0])")
          ROCM_SDK_PATH="$SITE_PACKAGES/_rocm_sdk_devel"
          echo "ROCM_SDK_PATH=$ROCM_SDK_PATH"
          echo "ROCM_SDK_PATH=$ROCM_SDK_PATH" >> "$GITHUB_ENV"

          # rocKE loads libamd_comgr through ctypes, not through CMake, so
          # -DROCM_PATH below is invisible to it. It resolves via $ROCM_PATH in
          # the environment or a globbed /opt/rocm*, and this runner is
          # wheel-only: there is no /opt/rocm, and the devel wheel's lib/ holds
          # headers and CMake config, not the runtime .so. comgr ships in the
          # sibling _rocm_sdk_core wheel, so name it explicitly.
          #
          # Exported under HKP_ROCKE_COMGR_LIB and fed to the configure step as
          # -DHIPKERNELPROVIDER_ROCKE_COMGR_LIB, not as rocke's own
          # ROCKE_COMGR_LIB: the cache variable is the channel hkp already
          # forwards to the configure probe, the pack step and the ctest
          # entries, so all four ask about the same library. Exporting rocke's
          # runtime name directly would instead override every python process
          # in every later step of this job, including ones that should be
          # exercising normal resolution.
          COMGR_LIB=$(ls "$SITE_PACKAGES/_rocm_sdk_core/lib/libamd_comgr.so".* 2>/dev/null | head -n1)
          test -n "$COMGR_LIB" || { echo "no libamd_comgr.so under $SITE_PACKAGES/_rocm_sdk_core/lib" >&2; exit 1; }
          echo "HKP_ROCKE_COMGR_LIB=$COMGR_LIB"
          echo "HKP_ROCKE_COMGR_LIB=$COMGR_LIB" >> "$GITHUB_ENV"

      - name: Check ROCm wheel freshness
        run: |
          "$VENV_PATH/bin/python" .github/scripts/check_wheel_freshness.py --max-age-days 14

      - name: Download third-party dependency sources
        run: |
          set -euo pipefail
          "$VENV_PATH/bin/python" projects/hipdnn/python/download_third_party_deps.py \
            --deps-dir "$THIRD_PARTY_DEPS_DIR"

      - name: Install rocm_kpack
        run: |
          set -euo pipefail
          # Sparse, blobless, depth-1 checkout of just shared/kpack: the pinned
          # commit lives in the rocm-systems monorepo, so cloning it whole (or
          # letting pip do it via a git+ URL) would pull far more than the packer.
          KPACK_SRC="${RUNNER_TEMP}/rocm-systems-kpack"
          rm -rf "$KPACK_SRC"
          mkdir -p "$KPACK_SRC"
          git -C "$KPACK_SRC" init -q .
          git -C "$KPACK_SRC" remote add origin https://github.com/ROCm/rocm-systems.git
          git -C "$KPACK_SRC" sparse-checkout init --cone
          git -C "$KPACK_SRC" sparse-checkout set shared/kpack
          git -C "$KPACK_SRC" fetch --depth 1 --filter=blob:none origin "${{ steps.ci-env.outputs.kpack-ref }}"
          git -C "$KPACK_SRC" checkout -q FETCH_HEAD
          # Confirms the fetch landed on the pinned commit.
          fetched=$(git -C "$KPACK_SRC" rev-parse HEAD)
          test "$fetched" = "${{ steps.ci-env.outputs.kpack-ref }}" || { echo "rocm-systems is $fetched, expected ${{ steps.ci-env.outputs.kpack-ref }}" >&2; exit 1; }
          # Installing the directory rebuilds and reinstalls every time, so a
          # warm venv cannot keep an older build of this same 0.1.0 version.
          "$VENV_PATH/bin/pip" install "$KPACK_SRC/shared/kpack"
          # Derived from the installed module, which also proves it imports.
          KPACK_PYTHON_DIR=$("$VENV_PATH/bin/python" -c "import pathlib, rocm_kpack; print(pathlib.Path(rocm_kpack.__file__).parent.parent.as_posix())")
          test -n "$KPACK_PYTHON_DIR" || { echo "empty rocm_kpack python dir" >&2; exit 1; }
          echo "KPACK_PYTHON_DIR=$KPACK_PYTHON_DIR" >> "$GITHUB_ENV"

      - name: Configure superbuild
        run: |
          cmake --preset hipdnn-dev-all -GNinja \
            -DROCM_PATH="$ROCM_SDK_PATH" \
            -DCMAKE_PROGRAM_PATH="$ROCM_SDK_PATH/lib/llvm/bin" \
            -DGPU_TARGETS="$GPU_TARGET" \
            -DROCM_LIBS_ENABLE_ROOT_CTEST=ON \
            -DENABLE_CLANG_FORMAT=OFF \
            -DENABLE_CLANG_TIDY=ON \
            -DHIPKERNELPROVIDER_ENABLE_ROCKE=ON \
            -DHIPDNN_ENABLE_CUDNN_COMPATIBILITY=ON \
            -DHIPDNN_ENABLE_KERNEL_INGESTOR=ON \
            -DHIPDNN_ENABLE_SDPA=ON \
            -DHIPKERNELPROVIDER_PRODUCTION_SOURCE_ROOT="$GITHUB_WORKSPACE/dnn-providers/hip-kernel-provider/descriptor-packaging/examples/descriptors" \
            -DHIPKERNELPROVIDER_PRODUCTION_ENABLE_HIP=ON \
            -DHIPKERNELPROVIDER_PRODUCTION_ENABLE_ROCKE=ON \
            -DHIPKERNELPROVIDER_ROCKE_COMGR_LIB="$HKP_ROCKE_COMGR_LIB" \
            -DHIPKERNELPROVIDER_KPACK_REQUIRE_HIPCC=ON \
            -DHIPKERNELPROVIDER_KPACK_REQUIRE_COMGR=ON \
            -DHIPKERNELPROVIDER_KPACK_PYTHON_DIR="$KPACK_PYTHON_DIR" \
            -DCMAKE_CXX_CLANG_TIDY=/usr/bin/clang-tidy-20 \
            -DFETCHCONTENT_SOURCE_DIR_NANOBIND="$THIRD_PARTY_DEPS_DIR/nanobind-2.12.0" \
            -DFETCHCONTENT_SOURCE_DIR_TSL_ROBIN_MAP="$THIRD_PARTY_DEPS_DIR/robin-map-1.4.1" \
            -DPython_EXECUTABLE="$VENV_PATH/bin/python" \
            -DPython3_EXECUTABLE="$VENV_PATH/bin/python"

      - name: Build
        run: cmake --build build

      # Packing is skipped with a STATUS message, so a resolution regression
      # would otherwise pass CI while producing no archives.
      - name: Verify kpack archives were produced
        run: |
          set -euo pipefail
          shopt -s nullglob
          kpacks=(build/dnn-providers/hip-kernel-provider/src/engines/asm_sdpa_engine/.kpack/*.kpack)
          test "${#kpacks[@]}" -gt 0 || { echo "no .kpack archives produced" >&2; exit 1; }
          printf '%s\n' "${kpacks[@]}"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # Golden-data validation used to live here as a schedule-gated re-run of the
      # external integration targets with HIPDNN_TEST_VERIFICATION_MODE=golden-check.
      # That spelling is retired: it is now the hipdnn_golden_data_tests binary,
      # registered as an ordinary ctest target, so the "Run tests" step above already
      # covers it -- once per run rather than once per provider, and with no env var.
      #
      # Note it validates nothing until the golden .bin blobs are pulled: this
      # workflow sparse-checks-out .dvc but never runs `dvc pull`, so every bundle
      # currently registers as "without golden data".

      - name: Patch ROCm SDK with superbuild outputs
        run: cmake --install build --prefix "$ROCM_SDK_PATH"

      - name: Install Python build dependencies
        run: |
          set -euo pipefail
          "$VENV_PATH/bin/python" -m pip install --upgrade build numpy pytest

      - name: Pack frontend wheel
        run: |
          "$VENV_PATH/bin/python" projects/hipdnn/python/frontend_wheel_package/pack_frontend_wheel.py \
            --build-dir build \
            --wheel-dir build/wheel_package

      - name: Install frontend wheel
        run: |
          set -euo pipefail
          wheel=$(ls build/wheel_package/hipdnn_frontend-*.whl)
          "$VENV_PATH/bin/python" -m pip install --force-reinstall "$wheel"

      - name: Run frontend wheel tests
        run: |
          # ROCM_PATH is what conftest.py resolves test_good_plugin from;
          # LD_LIBRARY_PATH is how the wheel's extension finds libhipdnn_backend.
          ROCM_PATH="$ROCM_SDK_PATH" \
            LD_LIBRARY_PATH="$ROCM_SDK_PATH/lib:${LD_LIBRARY_PATH:-}" \
            "$VENV_PATH/bin/python" -m pytest -q projects/hipdnn/python/frontend_wheel_package/tests

  hipdnn_build_summary:
    name: hipDNN Superbuild Summary
    if: always()
    needs:
      ["hipdnn-linux-superbuild"]
    runs-on: ubuntu-24.04
    steps:
      - name: Report results
        run: |
          echo '${{ toJson(needs) }}'
          FAILED_JOBS="$(echo '${{ toJson(needs) }}' \
            | jq --raw-output \
            'map_values(select(.result!="success" and .result!="skipped")) | keys | join(",")' \
          )"
          if [[ "${FAILED_JOBS}" != "" ]]; then
            echo "Failed jobs: ${FAILED_JOBS}"
            exit 1
          fi
